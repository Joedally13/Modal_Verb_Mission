<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modal Verb Mission</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d36;color:#172740;font:18px system-ui,sans-serif}main{max-width:850px;margin:35px auto;padding:24px}header{color:white;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}header b{letter-spacing:2px}#panel{background:#fff;border-radius:22px;padding:clamp(22px,5vw,48px);box-shadow:0 12px 40px #0004}h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:12px 0 22px}h2{font-size:27px}p{line-height:1.55}button{font:inherit;font-weight:700;border:2px solid transparent;border-radius:12px;padding:16px 22px;cursor:pointer;background:#244dad;color:white}button:focus-visible{outline:4px solid #e3a427;outline-offset:3px}button:disabled{cursor:default;opacity:1}.choice{display:block;width:100%;text-align:left;background:#edf2fc;color:#172740;border-color:#c3d0e9;margin:12px 0}.choice:hover:not(:disabled){background:#dbe7ff}.choice.right{background:#d9f4e4;border-color:#26834d}.choice.wrong{background:#fce6e3;border-color:#ba4940}.tag{font-size:14px;font-weight:800;letter-spacing:1.5px;color:#3457a5;text-transform:uppercase}.track{height:13px;background:#dce4ef;border-radius:10px;overflow:hidden;margin:12px 0 25px}.fill{height:100%;background:#2875d1;transition:width .2s}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;background:#eef3fb;border-radius:12px;padding:18px;min-width:120px}.stat strong{display:block;font-size:30px}.feedback{padding:16px;background:#eef3fb;border-radius:12px;margin:18px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.secondary{background:#e7edf7;color:#18366e}.mission{border-left:5px solid #3479d4;padding:4px 14px;margin:20px 0}.review{border-bottom:1px solid #cbd5e3;padding:14px 0}.muted{color:#52627a;font-size:15px}#score{font-weight:700}@media(max-width:500px){main{padding:12px;margin:10px auto}}
</style></head><body><main><header><b>MODAL VERB MISSION</b><span id="score"></span></header><section id="panel" aria-live="polite"></section></main><script>
const bank=[
[2,'I ___ like to go to the beach tomorrow.',['will','would','can'],'would','Would like expresses a wish or preference.'],
[6,'Gina ___ get plenty of rest if she is sick. Which word gives advice?',['should','could','will'],'should','Should expresses advice or a recommendation.'],
[8,'If it begins to rain, we ___ not be able to picnic in the park. Which word expresses uncertainty?',['could','can','might'],'might','Might expresses an uncertain possibility.'],
[10,'Miguel promises he ___ teach me to play the guitar.',['will','may','must'],'will','Will expresses a promised future action.'],
[12,'Fiona ___ not write very well right now because she broke her arm. Which word describes her ability?',['should','will','can'],'can','Can describes ability. Can not means she is unable to do something.'],
[16,'Carl ___ hurt himself if he is not careful.',['could','must','should'],'could','Could expresses a possible outcome.'],
[24,'The bus ___ arrive late this morning. Which word expresses a possibility?',['may','can','would'],'may','May expresses a possibility.'],
[26,'To be dismissed for recess, students ___ throw their garbage away in the trash cans.',['could','must','might'],'must','Must expresses a requirement.'],
[28,'___ you like a piece of gum?',['would','can','will'],'would','Would you like is a polite way to offer something.'],
[30,'We ___ love to explore the city tomorrow. Which word expresses a preference?',['will','could','would'],'would','Would love expresses a wish or preference.'],
[1,'We <b>might</b> miss our flight if there is a lot of traffic on the roads.',['invitation or offer','probability or possibility','suggestion'],'probability or possibility','Might tells us that missing the flight is possible.'],
[3,'I <b>would</b> love a cup of hot cocoa.',['polite request or inquiry','obligation','preference'],'preference','Would love expresses a preference or desire.'],
[5,'You <b>may</b> sit near your friend on the bus.',['formal permission','polite request','probability'],'formal permission','May tells us that someone has given permission.'],
[7,'My little brother <b>cannot</b> tie his shoes.',['permission','informal polite request','ability or possibility'],'ability or possibility','Cannot describes something he is unable to do.'],
[9,'The rain <b>will</b> cause a mud slide.',['invitation or offer','prediction or future action','obligation'],'prediction or future action','Will expresses a prediction about the future.'],
[13,'Ty <b>must</b> pass many tests to work as a lifeguard.',['strong certainty','obligation','prohibition or restriction'],'obligation','Must expresses a requirement that Ty needs to meet.'],
[15,'Jung <b>could</b> work over the summer to earn money for a car.',['suggestion','polite request','probability'],'suggestion','Could presents a possible course of action as a suggestion.'],
[19,'You <b>should</b> wear a rain coat.',['advice','strong certainty','deduction or conclusion'],'advice','Should gives advice about what to do.'],
[23,'The swimmers <b>must</b> be cold in the icy water.',['obligation','probability or possibility','strong certainty'],'strong certainty','Must expresses a strong belief based on the situation.'],
[29,'<b>Would</b> you sing at my party?',['preference','polite request or inquiry','probability'],'polite request or inquiry','Would is used to ask someone politely to do something.']];
const panel=document.querySelector('#panel'), score=document.querySelector('#score');let questions=[],i=0,results=[],locked=false;const shuffle=a=>{a=[...a];for(let n=a.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a};const correct=()=>results.filter(r=>r.ok).length;function update(){score.textContent=results.length?`${correct()*100} points | ${correct()}/${results.length} correct`:''}function show(html){panel.innerHTML=html;window.scrollTo(0,0)}function home(){score.textContent='';show(`<div class="tag">Your grammar challenge</div><h1>Become a Modal Master</h1><p>Complete two missions to show what you know about modal auxiliary verbs.</p><div class="mission"><b>Mission 1: Choose the Verb</b><p>Choose the word that best completes each sentence. 10 questions.</p></div><div class="mission"><b>Mission 2: Discover the Meaning</b><p>Identify what each modal verb expresses. 10 questions.</p></div><p>Earn 100 points for every correct answer. Take your time and read the feedback before moving on.</p><button onclick="start()">Start Mission</button>`)}function start(){questions=[...shuffle(bank.slice(0,10)),...shuffle(bank.slice(10))];i=0;results=[];update();question()}function question(){locked=false;let q=questions[i];let opts=shuffle(q[2]);show(`<div class="tag">Mission ${i<10?1:2} of 2: ${i<10?'Choose the Verb':'Discover the Meaning'}</div><p>Question ${i+1} of 20</p><div class="track" role="progressbar" aria-label="Questions completed" aria-valuenow="${i}" aria-valuemin="0" aria-valuemax="20"><div class="fill" style="width:${i*5}%"></div></div><p>${i<10?'Which modal auxiliary verb best completes the sentence?':'Which mood or purpose does the modal auxiliary verb express?'}</p><h2>${q[1]}</h2><div id="choices"></div><div id="response"></div>`);opts.forEach((a,n)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+n)}. ${a}`;b.dataset.answer=a;b.onclick=()=>answer(a,b);document.querySelector('#choices').append(b)})}function answer(a,b){if(locked)return;locked=true;let q=questions[i],ok=a===q[3];results.push({q,a,ok});document.querySelectorAll('.choice').forEach(el=>{el.disabled=true;if(el.dataset.answer===q[3])el.classList.add('right')});if(!ok)b.classList.add('wrong');update();document.querySelector('.fill').style.width=results.length*5+'%';document.querySelector('.track').setAttribute('aria-valuenow',results.length);document.querySelector('#response').innerHTML=`<div class="feedback"><b>${ok?'Correct! +100 points':'Not quite. Correct answer: '+q[3]}</b><p>${q[4]}</p></div><button id="next" onclick="next()">${i===19?'See My Results':i===9?'Complete Mission 1':'Next Question'}</button>`;document.querySelector('#next').focus()}function next(){if(!locked)return;i++;if(i===20){finish();return}if(i===10){show(`<div class="tag">Checkpoint reached</div><h1>Mission 1 Complete!</h1><p>You answered ${correct()} out of 10 correctly.</p><div class="track"><div class="fill" style="width:50%"></div></div><h2>Next: Discover the Meaning</h2><p>Now identify the purpose of the modal auxiliary verb in each sentence.</p><button onclick="question()">Begin Mission 2</button>`);return}question()}function finish(){let n=correct(),rank=n>=18?'Modal Master':n>=15?'Modal Expert':n>=11?'Modal Apprentice':'Modal Explorer';show(`<div class="tag">Both missions completed</div><h1>Mission Complete!</h1><h2>${rank}</h2><div class="track"><div class="fill" style="width:100%"></div></div><div class="stats"><div class="stat">Correct<strong>${n}/20</strong></div><div class="stat">Accuracy<strong>${n*5}%</strong></div><div class="stat">Points<strong>${n*100}</strong></div></div><p>Mission 1: ${results.slice(0,10).filter(r=>r.ok).length}/10<br>Mission 2: ${results.slice(10).filter(r=>r.ok).length}/10</p><p>${n===20?'Perfect score! You answered every question correctly.':'Review your answers to strengthen your understanding.'}</p><div class="actions"><button onclick="review()">Review Your Answers</button><button class="secondary" onclick="start()">Play Again</button></div>`)}function review(){show(`<div class="tag">Mission review</div><h1>Review Your Answers</h1>${results.map((r,j)=>`<div class="review"><b>Question ${j+1}: ${r.ok?'Correct':'Keep practicing'}</b><p>${r.q[1]}</p><p>Your answer: ${r.a}<br>Correct answer: <b>${r.q[3]}</b><br>${r.q[4]}</p></div>`).join('')}<div class="actions"><button onclick="finish()">Back to Results</button><button class="secondary" onclick="start()">Play Again</button></div>`)}home();
</script><footer style="text-align:center;color:#c3cfe5;font:12px system-ui;padding:15px">Practice questions adapted from Teacher Thrive, Modal Auxiliary Verbs Task Cards (2018).</footer></body></html>
